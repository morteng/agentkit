name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-runnable without a dummy commit — the Actions billing wall (U99) made
  # a check un-dispatchable at an old SHA exactly when re-running it mattered.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 0 for the --history check below. The default depth of 1 would
          # let it pass by inspecting a single commit — a green tick for a
          # question it never asked.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # gitleaks below cannot catch this class: nothing here is a credential.
      # The blocklist is not in the repo, because a list of names you must not
      # publish is itself a thing you must not publish. It arrives as a secret,
      # which forks and outside PRs do not get — there the step says it skipped
      # and passes, because a contributor cannot be asked to avoid names they
      # are not allowed to see. On `main` the secret is present and the check
      # is real.
      - name: No private identifiers (working tree)
        run: uv run python scripts/check_no_private_identifiers.py
        env:
          AGENTKIT_PRIVATE_IDENTIFIERS: ${{ secrets.AGENTKIT_PRIVATE_IDENTIFIERS }}
      # The step above only ever saw the checkout. On 2026-08-16 that was found
      # to be worth very little: it had been green throughout a period when 183
      # of 185 commits and all 33 tags carried the names, because deleting a
      # name in an ordinary commit does nothing to what a public repo still
      # serves. This is the one that asks about the repository rather than the
      # checkout. ~1s over ~900 blobs.
      - name: No private identifiers (history)
        run: uv run python scripts/check_no_private_identifiers.py --history
        env:
          AGENTKIT_PRIVATE_IDENTIFIERS: ${{ secrets.AGENTKIT_PRIVATE_IDENTIFIERS }}

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --group dev
      - run: uv run pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run pytest tests/integration -v -m integration
        env:
          REDIS_URL: redis://localhost:6379

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run pytest tests/e2e -v -m e2e

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run pytest --cov=agentkit --cov-report=term-missing --cov-fail-under=85 tests/
        env:
          REDIS_URL: redis://localhost:6379

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      # PYSEC-2026-89 (markdown) and PYSEC-2025-183 (pyjwt) have no fix release yet;
      # both are transitive deps with no exploitable path in agentkit. Revisit when upstream ships fixes.
      - run: uv run pip-audit --ignore-vuln PYSEC-2026-89 --ignore-vuln PYSEC-2025-183
      - run: uv run bandit -r src/agentkit -ll

  security-advisory:
    # U100: the standing red was invisible because gate and inventory shared one job. This leg is
    # deliberately NON-blocking — continue-on-error keeps its conclusion green — and carries the
    # full, unfiltered advisory inventory into an artifact plus the run summary, so a NEW finding
    # arrives as fresh rows someone is reading rather than as the same failed dot nobody has been
    # able to trust since U99 froze Actions. The downstream CI consumers read only a check's
    # status and conclusion and treat its name as an opaque string, so this job costs them nothing.
    # (Naming which repo they live in is exactly what the lint job below exists to prevent.)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - if: always()
        run: uv run pip-audit --format json > advisory.json || true
        # `|| true` mirrors continue-on-error at the step level: a vulnerability DATABASE
        # outage must not mask which findings were enumerable. The artifact records what ran.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-advisory-${{ github.sha }}
          path: advisory.json
          if-no-files-found: warn

  gitleaks:
    # Runs the same scan .pre-commit-config.yaml runs locally (same pinned
    # version, same .gitleaks.toml), so a PR from a fork that never installs
    # the pre-commit hook is still gated. See .gitleaks.toml for why the two
    # PII-detector test fixtures are allowlisted rather than exempted wholesale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks detect --source . --config .gitleaks.toml -v --redact
