name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --group dev
      - run: uv run pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run pytest tests/integration -v -m integration
        env:
          REDIS_URL: redis://localhost:6379

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run pytest tests/e2e -v -m e2e

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      - run: uv run pytest --cov=agentkit --cov-report=term-missing --cov-fail-under=85 tests/
        env:
          REDIS_URL: redis://localhost:6379

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group dev
      # PYSEC-2026-89 (markdown) and PYSEC-2025-183 (pyjwt) have no fix release yet;
      # both are transitive deps with no exploitable path in agentkit. Revisit when upstream ships fixes.
      - run: uv run pip-audit --ignore-vuln PYSEC-2026-89 --ignore-vuln PYSEC-2025-183
      - run: uv run bandit -r src/agentkit -ll

  gitleaks:
    # Runs the same scan .pre-commit-config.yaml runs locally (same pinned
    # version, same .gitleaks.toml), so a PR from a fork that never installs
    # the pre-commit hook is still gated. See .gitleaks.toml for why the two
    # PII-detector test fixtures are allowlisted rather than exempted wholesale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks detect --source . --config .gitleaks.toml -v --redact
